<style id="up-oracular-design-system">
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : AuthJS.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Módulo JavaScript de controle de sessão no frontend. Gerencia o estado de autenticação, intercepta rotas protegidas, armazena e recupera o token de sessão do sessionStorage e expõe funções para obter os dados do usuário logado.

 FUNCIONALIDADES:
   - AuthClient.isLoggedIn()    : Verifica se há uma sessão ativa no sessionStorage.
   - AuthClient.getToken()      : Retorna o token de sessão armazenado.
   - AuthClient.getUser()       : Retorna o objeto do usuário logado.
   - AuthClient.logout()        : Remove a sessão e redireciona para Login.
   - AuthClient.getUserRole()   : Retorna o perfil do usuário (Professor/Estagiario/Coordenacao).
   - AuthClient.initUI()        : Inicializa a UI com os dados do usuário (nome, perfil).

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - Auth.gs (via Api.html) : Ação 'auth.logout' para invalidar a sessão no backend.
   - sessionStorage         : Armazenamento do token e dados do usuário.

 EVENTOS E INTERAÇÕES:
   - DOMContentLoaded : Verifica autenticação e inicializa a UI.
   - click (logout)   : Chama AuthClient.logout().

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - RouterJS.html : Usa AuthClient.isLoggedIn() para proteger rotas.
   - Sidebar.html  : Usa AuthClient.getUserRole() para menus condicionais.
   - Header.html   : Usa AuthClient.getUser() para exibir nome e perfil.

 BOAS PRÁTICAS APLICADAS:
   - sessionStorage (não localStorage) para segurança: dados expiram ao fechar a aba.
   - Verificação de autenticação em toda navegação via RouterJS.
   - Inicialização da UI com dados do usuário para personalização.
 ============================================================
-->

<script>
var AuthClient = {
  isLoggedIn: function() { return !!sessionStorage.getItem('token'); },
  getToken:   function() { return sessionStorage.getItem('token'); },
  getUser:    function() {
    var u = sessionStorage.getItem('user');
    if (!u) return null;
    try {
      var parsed = JSON.parse(u);
      return parsed && typeof parsed === 'object' ? parsed : null;
    } catch (error) {
      sessionStorage.removeItem('user');
      return null;
    }
  },
  getUserRole: function() {
    var u = this.getUser();
    return u ? (u.perfil || u.role) : null;
  },
  logout: function() {
    if (this._logoutInFlight) return this._logoutInFlight;
    var token = this.getToken();
    var self = this;
    this._logoutInFlight = Api.call('auth.logout', { token: token }).then(function() {
      sessionStorage.clear();
      Router.navigate(ROUTES.LOGIN);
    }, function() {
      // A sessão local não deve ficar presa quando a confirmação remota falha.
      sessionStorage.clear();
      Router.navigate(ROUTES.LOGIN);
    }).finally(function() {
      self._logoutInFlight = null;
    });
    return this._logoutInFlight;
  },
  initUI: function() {
    var user = this.getUser();
    if (!user) return;
    var nameEl = document.getElementById('user-name');
    var roleEl = document.getElementById('user-role');
    if (nameEl) nameEl.textContent = user.nome;
    if (roleEl) roleEl.textContent = user.perfil || user.role || '';
    // Ocultar menus por perfil
    if ((user.perfil || user.role) !== 'Coordenacao') {
      document.querySelectorAll('.role-coord').forEach(function(el) { el.style.display = 'none'; });
    }
  }
};
document.addEventListener('DOMContentLoaded', function() {
  // O login entrega o token no fragmento para que ele não seja enviado em
  // logs HTTP. Promova-o para sessionStorage antes de qualquer RPC.
  try {
    var fragmentToken = new URLSearchParams(window.location.hash.replace(/^#/, '')).get('tok');
    if (fragmentToken) {
      sessionStorage.setItem('token', fragmentToken);
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    }
  } catch (ignored) {}

  if (!AuthClient.isLoggedIn() && !window.location.hash.includes('login')) {
    Router.navigate(ROUTES.LOGIN);
  } else {
    AuthClient.initUI();
    if (!AuthClient.getUser() && AuthClient.isLoggedIn() && typeof Api !== 'undefined') {
      Api.call('auth.me', {}).then(function(user) {
        sessionStorage.setItem('user', JSON.stringify(user || {}));
        AuthClient.initUI();
      }).catch(function() { sessionStorage.clear(); });
    }
  }
  var logoutBtn = document.getElementById('btn-logout');
  if (logoutBtn) logoutBtn.addEventListener('click', function() { AuthClient.logout(); });
});
</script>
