<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : StudentForm.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Formulário de cadastro e edição de alunos, e também tela de perfil completo do estudante. Exibe dados cadastrais, histórico de rubricas de evolução, histórico de presenças nas sessões e participações no Mural da Evolução.

 FUNCIONALIDADES:
   - Campos de cadastro: Nome, Turma, Data de Nascimento, Necessidades Especiais.
   - Modo perfil: exibe histórico de rubricas em tabela com evolução por semana.
   - Gráfico de evolução individual ao longo das semanas.
   - Lista de sessões em que o aluno foi selecionado e participou.
   - Botão 'Exportar Histórico' para gerar PDF via ExportService.gs.

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - StudentController.gs  : Ações 'student.create', 'student.update', 'student.getProfile'.
   - EvaluationDAO.gs      : 'evaluation.getByStudent' para o histórico de rubricas.
   - AttendanceDAO.gs      : 'attendance.getByStudent' para o histórico de presenças.
   - ExportService.gs      : 'export.studentReport' para gerar o PDF.

 EVENTOS E INTERAÇÕES:
   - DOMContentLoaded  : Carrega dados do aluno em modo edição/perfil.
   - submit (form)     : Salva os dados do aluno.
   - click (exportar)  : Gera e baixa o PDF do histórico.

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - DashboardCharts.html : Gráfico de evolução individual.
   - ModalAlert.html      : Feedback de sucesso/erro.
   - Styles.html          : CSS do formulário e perfil.
   - Api.html             : Chamadas ao backend.

 BOAS PRÁTICAS APLICADAS:
   - Modo duplo: formulário de cadastro e tela de perfil na mesma view.
   - Histórico de evolução com gráfico para visualização do progresso.
   - Exportação de PDF para reuniões de pais e conselho escolar.
 ============================================================
-->

<div id='student-form-view'>
  <h2 id='student-form-title'>Novo Aluno</h2>
  <form id='student-form' onsubmit="event.preventDefault();">
    <input type='hidden' id='student-id'>
    <div class='form-group'><label>Nome Completo *</label><input inputmode="text" type='text' id='sf-nome' required autocomplete="name"></div>
    <div class='form-group'><label>Turma *</label><input inputmode="text" type='text' id='sf-turma' required placeholder='Ex: 3A' autocomplete="name"></div>
    <div class='form-group'><label>Data de Nascimento</label><input type='date' id='sf-nascimento'></div>
    <div class='form-group'><label>Necessidades Especiais</label><textarea id='sf-necessidades'></textarea></div>
    <div class='form-actions'>
      <button type='submit'>Salvar</button>
      <button type='button' onclick="Router.navigate('/alunos')">Cancelar</button>
    </div>
  </form>
  <div id='student-history' class='hidden'>
    <h3>Histórico de Evolução</h3>
    <div id='student-chart'></div>
    <table id='rubric-history-table'><thead><tr><th>Semana</th><th>Autorregulação</th><th>Cooperação</th><th>Expressão</th><th>Pertencimento</th><th>Evolução</th></tr></thead><tbody></tbody></table>
    <button id='btn-export-student' type='button' onclick="sfFeature('export.pdf',{title:'Relatório do Aluno',subtitle:'Histórico de evolução socioemocional'},{pending:'Gerando PDF...',success:'PDF gerado.',openUrl:true})">Exportar PDF</button>
  </div>
</div>
