<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : EmailPreview.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Tela de pré-visualização dos e-mails automáticos enviados pelo sistema. Permite à Coordenação revisar o conteúdo dos e-mails de notificação de seleção, confirmação de sessão e relatório semanal antes de enviá-los.

 FUNCIONALIDADES:
   - Seleção do tipo de e-mail para pré-visualizar.
   - Pré-visualização do HTML do e-mail em iframe.
   - Botão 'Enviar Agora' para disparar o e-mail imediatamente.
   - Histórico dos últimos 10 e-mails enviados com data e destinatário.
   - Configuração dos destinatários padrão para cada tipo de e-mail.

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - EmailService.gs  : Ação 'email.preview' para obter o HTML do e-mail.
   - EmailService.gs  : Ação 'email.sendNow' para enviar imediatamente.
   - EmailService.gs  : Ação 'email.getHistory' para o histórico.

 EVENTOS E INTERAÇÕES:
   - change (tipo)    : Carrega a pré-visualização do e-mail selecionado.
   - click (enviar)   : Envia o e-mail após confirmação.

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - ModalConfirm.html : Confirmação antes de enviar.
   - Styles.html       : CSS da tela de e-mail.
   - Api.html          : Chamadas ao backend.

 BOAS PRÁTICAS APLICADAS:
   - Acesso restrito ao perfil Coordenação.
   - Pré-visualização em iframe para renderização fiel do HTML do e-mail.
   - Histórico de envios para rastreabilidade.
 ============================================================
-->

<div id='email-preview-view'>
  <div class='view-header'>
    <h2>Pré-visualização de E-mails</h2>
  </div>
  <div class='form-group'>
    <label>Tipo de E-mail</label>
    <select id='email-type-select'>
      <option value='selection'>Notificação de Seleção</option>
      <option value='session'>Confirmação de Sessão</option>
      <option value='weekly'>Relatório Semanal</option>
    </select>
  </div>
  <div id='email-preview-container'>
    <iframe id='email-preview-frame' style='width:100%;height:400px;border:1px solid #e2e8f0;border-radius:8px;'></iframe>
  </div>
  <div class='form-actions'>
    <button id='btn-send-email-now' type='button' onclick="var el=document.getElementById('email-to');var to=(el&&el.value)||prompt('Enviar para qual e-mail?');if(to)sfFeature('email.send',{to:to,subject:'Notificação — Cine Clube Horizontes Animados',body:'Mensagem enviada pelo painel de comunicação.'},{pending:'Enviando...',success:'E-mail enviado.'})">Enviar Agora</button>
  </div>
  <h3>Histórico de Envios</h3>
  <table id='email-history-table'>
    <thead><tr><th>Data</th><th>Tipo</th><th>Destinatário</th><th>Status</th></tr></thead>
    <tbody id='email-history-tbody'></tbody>
  </table>
</div>
