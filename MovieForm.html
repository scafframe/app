<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : MovieForm.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Formulário para adicionar e editar obras na curadoria analítica. Campos completos conforme o padrão de registro definido no relatório: Título, Ano, Eixo, Duração, Foco Socioemocional, Técnica/Origem, Fonte de Acesso, Classificação Indicativa e Observações de Mediação.

 FUNCIONALIDADES:
   - Campos: Título, Ano, Eixo, Duração (minutos), Foco Socioemocional.
   - Campos: Técnica/Origem, Fonte de Acesso (URL), Classificação Indicativa.
   - Campo de Observações de Mediação com sugestões de perguntas pedagógicas.
   - Validação de classificação indicativa (apenas L e 10 para o público infantil).
   - Validação de duração máxima de 40 minutos para adequação à sessão.

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - MovieController.gs : Ações 'movie.create' e 'movie.update'.
   - Validation.gs      : Validação server-side de classificação e duração.

 EVENTOS E INTERAÇÕES:
   - submit (form)    : Salva o filme na curadoria.
   - click (cancelar) : Volta para MovieList.
   - input (duração)  : Aviso visual se duração > 40 minutos.

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - ModalAlert.html : Feedback de sucesso/erro.
   - Styles.html     : CSS do formulário.
   - Api.html        : Chamadas ao backend.

 BOAS PRÁTICAS APLICADAS:
   - Campos alinhados ao padrão de registro definido no relatório do projeto.
   - Validação de classificação indicativa para proteção do público infantil.
   - Observações de mediação como campo de texto rico para orientação pedagógica.
 ============================================================
-->

<div id='movie-form-view'>
  <h2 id='movie-form-title'>Adicionar Filme à Curadoria</h2>
  <form id='movie-form' onsubmit="event.preventDefault();">
    <input type='hidden' id='movie-id'>
    <div class='form-row'>
      <div class='form-group'><label>Título *</label><input inputmode="text" type='text' id='mf-titulo' required autocomplete="name"></div>
      <div class='form-group'><label>Ano *</label><input inputmode="decimal" type='number' id='mf-ano' min='1908' max='2030' required></div>
    </div>
    <div class='form-row'>
      <div class='form-group'><label>Eixo *</label>
        <select id='mf-eixo' required>
          <option value='Disney/Pixar'>Eixo 1: Disney/Pixar</option>
          <option value='Reflexao'>Eixo 2: Cinema de Reflexão</option>
          <option value='Nacional'>Eixo 3: Identidade Brasileira</option>
          <option value='Festivais'>Eixo 4: Festivais</option>
        </select>
      </div>
      <div class='form-group'><label>Duração (min) *</label><input inputmode="decimal" type='number' id='mf-duracao' min='1' max='120' required></div>
    </div>
    <div class='form-group'><label>Foco Socioemocional *</label><input inputmode="text" type='text' id='mf-foco' required placeholder='Ex: Empatia, Resiliência, Cooperação' autocomplete="name"></div>
    <div class='form-group'><label>Técnica / Origem</label><input inputmode="text" type='text' id='mf-tecnica' placeholder='Ex: CGI, Stop-motion, 2D Digital' autocomplete="name"></div>
    <div class='form-group'><label>Fonte de Acesso (URL)</label><input inputmode="url" type='url' id='mf-fonte'></div>
    <div class='form-group'><label>Classificação Indicativa *</label>
      <select id='mf-classificacao' required>
        <option value='L'>Livre (L)</option>
        <option value='10'>10 anos</option>
      </select>
    </div>
    <div class='form-group'><label>Observações de Mediação</label><textarea id='mf-observacoes' rows='4' placeholder='Sugestões de perguntas: O que o personagem queria? Qual gesto indicou tristeza?'></textarea></div>
    <div class='form-actions'>
      <button type='submit'>Salvar na Curadoria</button>
      <button type='button' onclick="Router.navigate('/filmes')">Cancelar</button>
    </div>
  </form>
</div>
