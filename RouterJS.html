<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : RouterJS.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Roteador client-side para a SPA. Gerencia a navegação entre as views sem recarregar a página, alternando a visibilidade das divs de conteúdo e carregando os dados necessários para cada view. Usa o hash da URL (#/rota) para manter o histórico de navegação.

 FUNCIONALIDADES:
   - Router.navigate(route)    : Navega para uma rota e carrega a view correspondente.
   - Router.register(route, fn): Registra um handler de carregamento para uma rota.
   - Router.getCurrentRoute()  : Retorna a rota atual.
   - _loadView(route)          : Carrega o HTML da view e injeta no #app.
   - _handleHash()             : Detecta mudanças no hash da URL.

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - AuthClient (AuthJS.html) : Verifica autenticação antes de carregar rotas protegidas.
   - Api.html                 : As views chamam Api.call() ao serem carregadas.

 EVENTOS E INTERAÇÕES:
   - hashchange (window) : Detecta mudanças de rota e carrega a view correspondente.
   - DOMContentLoaded    : Carrega a rota inicial baseada no hash atual.

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - AuthJS.html  : Proteção de rotas autenticadas.
   - Loader.html  : Exibido durante a transição de views.
   - Styles.html  : CSS das transições de página.

 BOAS PRÁTICAS APLICADAS:
   - Hash-based routing para compatibilidade com o Apps Script (sem servidor próprio).
   - Proteção automática de rotas: redireciona para login se não autenticado.
   - Carregamento lazy das views para melhor performance inicial.
 ============================================================
-->

<script>
var SCAFFRAME_ROUTE_PAGES = {
  '/dashboard': 'Dashboard',
  '/alunos': 'StudentList', '/alunos/novo': 'StudentForm',
  '/filmes': 'MovieList', '/filmes/novo': 'MovieForm', '/filmes/revisao': 'MovieReviewForm',
  '/sessoes': 'SessionList', '/sessoes/nova': 'SessionForm',
  '/rubricas': 'EvaluationList', '/rubricas/nova': 'EvaluationForm',
  '/presencas': 'AttendanceList', '/presencas/registrar': 'AttendanceForm',
  '/selecao': 'SelectionView', '/selecao/nova': 'SelectionForm',
  '/relatorios': 'ReportView', '/relatorios/piloto': 'PilotReport',
  '/usuarios': 'UserList', '/usuarios/novo': 'UserForm',
  '/configuracoes': 'Settings', '/perfil': 'Profile',
  '/mural': 'MuralEvolution', '/mural/novo': 'MuralForm',
  '/notificacoes': 'NotificationList', '/auditoria': 'AuditLogView',
  '/ajuda': 'Help', '/configuracoes/planilha': 'SpreadsheetStatus',
  '/configuracoes/gatilhos': 'WeeklyTriggerStatus', '/comunicacao/email': 'EmailPreview',
  '/comunicacao/colab': 'ColabIntegration'
};

function normalizeScafframeRoute(route) {
  var value = String(route || '').trim();
  if (value.charAt(0) === '#') value = value.slice(1);
  if (value.charAt(0) !== '/') value = '/' + value;
  return value;
}

function readScafframeToken() {
  if (typeof AuthClient !== 'undefined' && AuthClient.getToken) return AuthClient.getToken() || '';
  return window.__CODEX_TOK__ || '';
}

var Router = {
  _routes: {},
  _current: null,
  register: function(route, handler) { this._routes[route] = handler; },
  navigate: function(route) {
    var normalizedRoute = normalizeScafframeRoute(route);
    if (!AuthClient.isLoggedIn() && normalizedRoute !== ROUTES.LOGIN) {
      window.top.location.href = '?page=Login'; return;
    }
    if (normalizedRoute === ROUTES.LOGIN) {
      window.top.location.href = '?page=Login'; return;
    }
    var page = SCAFFRAME_ROUTE_PAGES[normalizedRoute];
    if (!page) { window.location.hash = normalizedRoute; return; }
    var target = '?page=' + encodeURIComponent(page);
    var token = readScafframeToken();
    if (token) target += '#tok=' + encodeURIComponent(token);
    window.top.location.href = target;
  },
  getCurrentRoute: function() { return this._current; },
  _handleHash: function() {
    var hasHash = Boolean(window.location.hash);
    var route = normalizeScafframeRoute(window.location.hash.replace('#', '') ||
      window.__SCAFFRAME_INITIAL_ROUTE__ || (AuthClient.isLoggedIn() ? ROUTES.DASHBOARD : ROUTES.LOGIN));
    this._current = route;
    var handler = this._routes[route];
    if (handler) handler();
    else if (route === ROUTES.LOGIN && !AuthClient.isLoggedIn()) this.navigate(ROUTES.LOGIN);
    else if (!hasHash && route === window.__SCAFFRAME_INITIAL_ROUTE__) {
      // A view already veio renderizada pelo template do Apps Script.
    } else if (SCAFFRAME_ROUTE_PAGES[route]) this.navigate(route);
    else if (document.getElementById('app')) {
      document.getElementById('app').innerHTML = '<div role="alert" class="empty">Tela não encontrada.</div>';
    }
    // Atualizar item ativo no menu
    document.querySelectorAll('[data-route]').forEach(function(el) {
      var active = el.dataset.route === route;
      el.classList.toggle('active', active);
      if (active) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
    if (window.ScafframeNavigation) window.ScafframeNavigation.closeMobileSidebar();
  }
};
window.addEventListener('hashchange', function() { Router._handleHash(); });
document.addEventListener('DOMContentLoaded', function() { Router._handleHash(); });
</script>
