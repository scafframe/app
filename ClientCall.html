<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<script>
/**
 * codex-client-call-standardization
 * Wrapper unico sobre google.script.run para o Scafframe.
 *  - Promise em vez de callbacks aninhados.
 *  - Retry com backoff exponencial + jitter SO em falhas transitorias de transporte.
 *  - Normaliza o envelope StandardReturn ({success,data,error,meta}):
 *    resolve com .data em sucesso, rejeita com Error em falha (negocio nao sofre retry).
 *
 * Uso:
 *   ClientCall.call('handleRequest', [jsonString]).then(...).catch(...);
 *   // acucar: callServer('ping').then(...).catch(...);
 *
 * NUNCA chame google.script.run diretamente fora deste arquivo.
 */
(function (global) {
  if (global.ClientCall) { return; }

  var DEFAULTS = { retries: 2, baseDelayMs: 400, factor: 2, jitter: true, unwrap: true };

  function delay_(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function toError_(value) {
    if (value instanceof Error) { return value; }
    if (value === null || value === undefined) { return new Error('Erro desconhecido.'); }
    if (typeof value === 'string') { return new Error(value); }
    if (value.message) { return new Error(String(value.message)); }
    return new Error(String(value));
  }

  function isTransient_(error) {
    if (!error) { return true; }
    var msg = String(error.message || error).toLowerCase();
    if (msg.indexOf('metodo backend inexistente') >= 0) { return false; }
    if (msg.indexOf('google.script.run indisponivel') >= 0) { return false; }
    return true;
  }

  function isEnvelope_(value) {
    return Boolean(
      value && typeof value === 'object' &&
      typeof value.success === 'boolean' &&
      Object.prototype.hasOwnProperty.call(value, 'data') &&
      Object.prototype.hasOwnProperty.call(value, 'error')
    );
  }

  function unwrap_(value) {
    if (isEnvelope_(value)) {
      if (value.success) { return value.data; }
      var businessError = toError_(value.error);
      businessError.__business = true;
      if (value.meta && value.meta.code) businessError.code = value.meta.code;
      throw businessError;
    }
    return value;
  }

  function invoke_(method, args) {
    return new Promise(function (resolve, reject) {
      if (!global.google || !google.script || !google.script.run) {
        reject(new Error('google.script.run indisponivel')); return;
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) { resolve(res); })
        .withFailureHandler(function (err) { reject(toError_(err)); });
      if (typeof runner[method] !== 'function') {
        reject(new Error('metodo backend inexistente: ' + method)); return;
      }
      try {
        runner[method].apply(runner, args || []);
      } catch (err) {
        reject(toError_(err));
      }
    });
  }

  function call(method, args, options) {
    var cfg = {};
    var key;
    for (key in DEFAULTS) { if (DEFAULTS.hasOwnProperty(key)) { cfg[key] = DEFAULTS[key]; } }
    if (options) { for (key in options) { if (options.hasOwnProperty(key)) { cfg[key] = options[key]; } } }

    var attempt = 0;
    function attemptRun() {
      return invoke_(method, args).then(function (res) {
        return cfg.unwrap ? unwrap_(res) : res;
      }).catch(function (err) {
        // Falha de negocio (envelope.success === false) ja virou Error em unwrap_:
        // nao sofre retry. So retentamos falhas transitorias de transporte.
        if (attempt < cfg.retries && isTransient_(err) && !err.__business) {
          attempt += 1;
          var backoff = cfg.baseDelayMs * Math.pow(cfg.factor, attempt - 1);
          if (cfg.jitter) { backoff += Math.floor(Math.random() * cfg.baseDelayMs); }
          return delay_(backoff).then(attemptRun);
        }
        throw err;
      });
    }
    return attemptRun();
  }

  global.ClientCall = { call: call };
  global.callServer = function (method) {
    var args = Array.prototype.slice.call(arguments, 1);
    return call(method, args);
  };
})(window);
</script>
