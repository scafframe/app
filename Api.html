<style id="up-oracular-design-system">
:focus-visible {
  outline: 3px solid var(--accent, #8ab4f8);
  outline-offset: 2px;
}
:root {
  color-scheme: dark;
  --uo-bg: #15171c;
  --uo-panel: #20242b;
  --uo-text: #e9ecf1;
  --uo-muted: #b2b9c4;
  --uo-border: #343941;
  --uo-accent: #7aa2d6;
  --uo-radius-group: 10px;
  --uo-radius-control: 8px;
}

html, body {
  background: var(--uo-bg) !important;
  color: var(--uo-text) !important;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body, input, select, textarea, button {
  color: var(--uo-text);
}

.card, .panel, .modal, .dialog, dialog, .container,
.box, .widget, .section, .sidebar, .drawer, .popover,
[role="dialog"], [class*="card"], [class*="panel"] {
  background-color: var(--uo-panel) !important;
  border-color: var(--uo-border) !important;
  border-radius: var(--uo-radius-group) !important;
}

button, input, select, textarea, .btn, .button,
[role="button"], [role="menuitem"], .dropdown-item,
.menu-item, [class*="button"], [class*="dropdown-item"] {
  border-radius: var(--uo-radius-control) !important;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

input, select, textarea {
  background-color: var(--uo-panel) !important;
  border: 1px solid var(--uo-border) !important;
  padding: 8px !important;
  box-sizing: border-box;
}

label, .form-label, [class*="form-label"] {
  display: block;
  margin-bottom: 5px;
  color: var(--uo-muted) !important;
  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);
  background: var(--uo-panel);
  color: var(--uo-text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 120ms ease, transform 120ms ease;
}

.uo-feedback-box.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.uo-feedback-box[data-kind="ok"] {
  border-color: #8fc2a6;
  color: #8fc2a6;
}

.uo-feedback-box[data-kind="err"] {
  border-color: #d98b93;
  color: #d98b93;
}

form[aria-busy="true"] {
  opacity: 0.72;
  cursor: progress;
}

form[aria-busy="true"] :is(button, input[type="submit"], input[type="button"]) {
  pointer-events: none;
}

button, .btn-primary, .button-primary,
[class*="primary"][role="button"] {
  background-color: var(--uo-accent) !important;
}

p, small, .muted, .secondary, .subtitle,
[class*="muted"], [class*="secondary"] {
  color: var(--uo-muted) !important;
}

hr, table, th, td, fieldset {
  border-color: var(--uo-border) !important;
}

a {
  color: var(--uo-accent);
}

/* Geometrias funcionais permanecem circulares. */
.avatar, .spinner, .loading-ring, .dot, .status-dot,
[class*="avatar"], [class*="spinner"], [class*="loading-ring"] {
  border-radius: 50% !important;
}
</style>
<script id="up-oracular-form-feedback">
(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<!--
 ============================================================
 PROJETO  : Cine Clube Horizontes Animados
 ESCOLA   : Escola Classe 115 Norte — SEEDF / Brasília-DF
 ARQUIVO  : Api.html
 VERSÃO   : 1.0.0
 ============================================================

 DESCRIÇÃO PRINCIPAL:
   Módulo JavaScript client-side que encapsula todas as chamadas para google.script.run, convertendo o padrão de callbacks do Apps Script em Promises modernas. Injeta automaticamente o token de sessão em todas as requisições autenticadas.

 FUNCIONALIDADES:
   - Api.call(action, data)  : Envia uma requisição ao backend e retorna uma Promise.
   - Api.get(action, data)   : Alias para chamadas de leitura.
   - Api.post(action, data)  : Alias para chamadas de escrita.
   - _injectToken(data)      : Injeta o token de sessão em todas as requisições.
   - Api.onError(handler)    : Registra um handler global para erros de API.

 INTEGRAÇÕES COM O BACKEND (google.script.run):
   - google.script.run : API nativa do Apps Script para chamadas RPC.
   - Router.gs         : Todas as ações são roteadas pelo Router.gs.
   - Auth.gs           : Token de sessão injetado automaticamente.

 EVENTOS E INTERAÇÕES:
   - Chamado por todos os formulários e views para comunicação com o backend.
   - Intercepta erros de sessão expirada e redireciona para Login.

 DEPENDÊNCIAS / PARTIALS INCLUÍDOS:
   - AuthJS.html   : Fornece o token de sessão do sessionStorage.
   - Loader.html   : showLoader/hideLoader chamados automaticamente.
   - RouterJS.html : Redirecionamento em caso de sessão expirada.

 BOAS PRÁTICAS APLICADAS:
   - Conversão de callbacks para Promises para código mais legível.
   - Injeção automática do token para evitar repetição em cada chamada.
   - Interceptação global de erros 401 para redirecionamento ao login.
   - showLoader/hideLoader automáticos para feedback visual.
 ============================================================
-->

<script>
/**
 * Fachada de acoes do dominio. Delega ao ClientCall (retry/backoff/unwrap)
 * e ao handleRequest do backend. NAO chama google.script.run direto —
 * isso e responsabilidade exclusiva do ClientCall.html.
 *
 * Api.call resolve com o .data ja desempacotado do envelope StandardReturn
 * (sucesso) ou rejeita com Error contendo a mensagem legivel (falha).
 */
var Api = {
  call: function(action, data) {
    var payload = Object.assign({}, data || {});
    var token = (action !== 'auth.login') ? sessionStorage.getItem('token') : null;
    if (token) { payload.token = token; }

    if (typeof showLoader === 'function') { showLoader(); }
    var json = JSON.stringify({ action: action, data: payload, token: token });

    // Sem idempotência no servidor, uma resposta perdida não autoriza repetir a escrita.
    var options = action === 'questionario.save' ? { retries: 0 } : undefined;
    return ClientCall.call('handleRequest', [json], options)
      .then(function(data) {
        if (typeof hideLoader === 'function') { hideLoader(); }
        return data;
      })
      .catch(function(err) {
        if (typeof hideLoader === 'function') { hideLoader(); }
        var msg = (err && err.message) || 'Erro desconhecido.';
        // Sessao expirada/invalida: redireciona para o login.
        if (Number(err.code) === 401 || (!err.code && /sess(a|ã)o (inválida|invalida|expirada)/i.test(msg))) {
          if (typeof Router !== 'undefined' && Router.navigate && typeof ROUTES !== 'undefined') {
            Router.navigate(ROUTES.LOGIN);
          }
        } else if (action !== 'auth.login' && typeof ModalAlert !== 'undefined' && ModalAlert.show) {
          ModalAlert.show('error', 'Erro de Comunicação', msg);
        }
        throw err;
      });
  },
  get:  function(action, data) { return this.call(action, data); },
  post: function(action, data) { return this.call(action, data); }
};
</script>
